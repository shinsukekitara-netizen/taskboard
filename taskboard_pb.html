<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🔵 Task Board PB</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#edf2fc;--bg2:#e0eafa;--surface:#ffffff;--surface2:#f4f7ff;--surface3:#e8f0fd;
  --border:#c0d3f0;--border2:#9dbce8;--text:#1a3460;--text2:#4a6d9c;--text3:#8aaaca;
  --accent:#1a56db;--accent2:#6d28d9;--danger:#dc2626;--warn:#d97706;--ok:#059669;
  --r:12px;--rs:8px;--sh:0 4px 20px rgba(26,86,219,.1);--shl:0 8px 36px rgba(26,86,219,.18)
}
html{font-size:16px}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── HEADER ── */
.hdr-wrap{position:sticky;top:0;z-index:100;background:var(--bg)}
.hdr{background:linear-gradient(135deg,#1a56db 0%,#2563eb 50%,#1d4ed8 100%);border-bottom:1px solid rgba(255,255,255,.2);padding:14px 20px;backdrop-filter:blur(16px);box-shadow:0 4px 20px rgba(26,86,219,.35)}
.hdr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;user-select:none}
.logo:hover{opacity:.8}
.logo b{color:rgba(255,255,255,.85)}
.badge-row{display:flex;gap:6px;flex-wrap:wrap}
.dbadge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:.73rem;font-weight:600;cursor:pointer;transition:all .15s}
.dbadge:hover{transform:scale(1.05)}
.dbadge.today{background:rgba(255,255,255,.18);border:1px solid rgba(255,100,100,.8);color:#ffe0e0}
.dbadge.tmr{background:rgba(255,255,255,.18);border:1px solid rgba(255,220,80,.8);color:#fff9c4}
.dbadge.active{box-shadow:0 0 0 2px currentColor;transform:scale(1.07);filter:brightness(1.2)}
.dbadge.past{background:rgba(249,115,22,.2);border:1px solid #f97316;color:#fb923c}
.hdr-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border:none;border-radius:var(--rs);font-family:'Noto Sans JP',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.bp{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(26,86,219,.3)}.bp:hover{background:#1d4ed8;box-shadow:0 4px 14px rgba(26,86,219,.45)}
.bg{background:#fff;color:var(--text);border:1px solid var(--border);box-shadow:0 1px 4px rgba(26,86,219,.08)}.bg:hover{background:var(--surface3);border-color:var(--accent)}
.bd{background:rgba(220,38,38,.08);color:#b91c1c;border:1px solid rgba(220,38,38,.25)}.bd:hover{background:rgba(220,38,38,.15)}
.bsm{padding:5px 10px;font-size:.78rem}
.bico{padding:5px;background:transparent;color:var(--text2);border-radius:5px}.bico:hover{background:var(--surface3);color:var(--accent)}
.sort-on{border-color:var(--accent)!important;background:rgba(26,86,219,.1)!important;color:var(--accent)!important}


/* ── DATE RANGE FILTER ── */
.drbar{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.drbar label{font-size:.8rem;color:var(--text2);white-space:nowrap}
.drbar input[type=date]{padding:5px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:.82rem;font-family:'Noto Sans JP',sans-serif}
.drbar input[type=date]:focus{outline:none;border-color:var(--accent)}
.dr-view-btns{display:flex;gap:4px;margin-left:auto}
.dr-view-btn{padding:5px 12px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface2);color:var(--text2);font-size:.8rem;cursor:pointer;transition:all .15s}
.dr-view-btn.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent);font-weight:600}
/* B案：一覧表示モード */
.board.list-mode{display:flex;flex-direction:column;gap:10px}
.board.list-mode .pcard{width:100%;max-width:680px}
.dr-label{font-size:.72rem;color:var(--text3);margin-left:8px}
/* ── FILTER BAR ── */
.fbar{display:flex;gap:8px;padding:10px 20px;background:#dce9fa;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.sw{position:relative;flex:1;min-width:180px}
.sw .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.9rem}
.si{width:100%;padding:8px 10px 8px 34px;background:#fff;border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.83rem}
.si:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,86,219,.15)}
.fsel{padding:8px 10px;background:#fff;border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.83rem;cursor:pointer}
.fsel:focus{outline:none;border-color:var(--accent)}

/* ── MAIN ── */
.main{padding:20px}
.sec-lbl{font-size:.73rem;font-weight:700;letter-spacing:.12em;color:var(--text2);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-items:start}

/* ── PARENT CARD ── */
.pcard{border-radius:var(--r);overflow:visible;border:2px solid var(--border);box-shadow:var(--sh);cursor:grab;user-select:none;position:relative;
  transition:transform .2s,box-shadow .2s,border-color .2s,opacity .2s,margin-top .13s,margin-bottom .13s}
.pcard:hover{box-shadow:var(--shl);transform:translateY(-2px)}
.pcard.dragging{opacity:.45;cursor:grabbing;transform:scale(.98)}
.pcard.drag-ov{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(26,86,219,.25)}
.pcard.due-today{border-color:#ef4444!important;box-shadow:0 0 16px rgba(239,68,68,.3)}
.pcard.due-tmr{border-color:#f59e0b!important;box-shadow:0 0 12px rgba(245,158,11,.25)}
.pcard.due-past{border-color:#000000!important;box-shadow:0 0 10px rgba(0,0,0,.4)}
.pcard.done-st .cbody{opacity:.5}

/* ── CARD BAND ── */
.cband{height:54px;display:flex;align-items:center;padding:0 12px;gap:8px;border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0;overflow:hidden}
.b-ri{background:linear-gradient(135deg,#7f1d1d,#ef4444)}
.b-r{background:linear-gradient(135deg,#7c2d12,#f97316)}
.b-i{background:linear-gradient(135deg,#4c1d95,#8b5cf6)}
.b-n{background:linear-gradient(135deg,#1f2937,#4b5563)}
.ctitle{font-size:.93rem;font-weight:700;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctitle.done{text-decoration:line-through;opacity:.6}
.bbadges{display:flex;gap:4px;flex-shrink:0}
.bbadge{font-size:.62rem;padding:2px 6px;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;font-weight:700;letter-spacing:.04em}

/* ── CARD BODY ── */
.cbody{padding:10px 12px;border-radius:0 0 calc(var(--r) - 2px) calc(var(--r) - 2px)}

/* ── PARENT CARD COMPLETE CHECKBOX ── */
.pchk-wrap{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(26,86,219,.12)}
.pchk{width:17px;height:17px;border:2px solid var(--border2);border-radius:4px;background:#fff;cursor:pointer;flex-shrink:0;appearance:none;position:relative;transition:all .15s}
.pchk:hover{border-color:var(--accent)}
.pchk:checked{background:var(--ok);border-color:var(--ok);box-shadow:0 0 8px rgba(16,185,129,.5)}
.pchk:checked::after{content:'✓';position:absolute;top:-2px;left:1px;font-size:11px;color:#fff;font-weight:bold}
.pchk-label{font-size:.76rem;color:var(--text2);user-select:none;cursor:pointer}
.pcard.done-st{opacity:.6}
.pcard.done-st .cbody{opacity:1}

/* ── PROGRESS ── */
.prog-w{margin-bottom:8px}
.prog-b{height:3px;background:rgba(26,86,219,.12);border-radius:2px;overflow:hidden}
.prog-f{height:100%;background:linear-gradient(90deg,#1a56db,#6d28d9);border-radius:2px;transition:width .3s}
.prog-t{font-size:.68rem;color:var(--text2);margin-top:3px;font-family:'JetBrains Mono',monospace}

/* ── TAGS ── */
.tags-r{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.tpill{font-size:.68rem;padding:2px 7px;border-radius:10px;font-weight:600}
.created-at{font-size:.68rem;color:var(--text3);margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.05)}
.due-ch{font-size:.72rem;color:var(--text2);margin-bottom:7px;display:flex;align-items:center;gap:4px}
.memo-t{font-size:.76rem;color:var(--text);margin-bottom:8px;padding:5px 8px;background:rgba(26,86,219,.05);border-radius:5px;line-height:1.5;border-left:3px solid var(--accent);word-break:break-word;overflow-wrap:break-word;white-space:pre-wrap;max-width:100%;overflow:hidden}

/* ── CARD ACTIONS ── */
.cacts{display:flex;gap:5px;justify-content:flex-end;margin-top:8px;padding-top:8px;border-top:1px solid rgba(26,86,219,.1)}

/* ── SUBCARDS ── */
.subcards{display:flex;flex-direction:column-reverse;gap:0;margin-top:6px}
.ins-btn{width:100%;padding:4px;background:transparent;border:1px dashed var(--border2);border-radius:5px;color:var(--text3);font-size:.76rem;cursor:pointer;transition:all .15s;margin:1px 0;display:flex;align-items:center;justify-content:center;gap:3px}
.ins-btn:hover{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
.add-sub-btn{width:100%;padding:6px;background:rgba(26,86,219,.05);border:1px dashed rgba(26,86,219,.2);border-radius:6px;color:var(--text3);font-size:.78rem;cursor:pointer;transition:all .15s;margin-top:5px;display:flex;align-items:center;justify-content:center;gap:4px}
.add-sub-btn:hover{background:rgba(26,86,219,.1);border-color:rgba(26,86,219,.4);color:var(--accent)}

/* ── SUB CARD ── */
.scard{display:flex;align-items:stretch;background:var(--surface2);border-radius:7px;margin:2px 0;position:relative;overflow:hidden;border:1.5px solid transparent;cursor:grab;
  transition:transform .14s,border-color .14s,background .14s,opacity .14s,margin-top .11s,margin-bottom .11s}
.scard:hover{background:#e8f0fd;border-color:var(--accent)}
.scard.dragging-s{opacity:.35;cursor:grabbing}
.scard.drag-ov-s{border-color:var(--accent)!important;background:#ddeeff!important}
.scard.due-today{border-color:rgba(239,68,68,.55)!important}
.scard.due-tmr{border-color:rgba(245,158,11,.55)!important}
.scard.due-past{border-color:#000000!important}
.scard.s-done{background:rgba(26,86,219,.03)!important;border-color:transparent!important}
.scard.s-done .s-title{color:var(--text3);text-decoration:line-through;opacity:.6}
.scard.s-done .s-meta{color:var(--text3)}

/* sub bar */
.sbar{width:4px;flex-shrink:0;border-radius:0}
.sbar.g{background:#22c55e}.sbar.y{background:#eab308}.sbar.r2{background:#ef4444}.sbar.b{background:#06b6d4}
.s-content{flex:1;padding:7px 9px;min-width:0}
.s-top{display:flex;align-items:flex-start;gap:6px}
.s-chk{width:15px;height:15px;border:2px solid var(--border2);border-radius:3px;background:#fff;cursor:pointer;flex-shrink:0;margin-top:2px;appearance:none;position:relative;transition:all .15s}
.s-chk:checked{background:var(--ok);border-color:var(--ok)}
.s-chk:checked::after{content:'✓';position:absolute;top:-2px;left:1px;font-size:10px;color:#fff;font-weight:bold}
.s-title{flex:1;font-size:.83rem;font-weight:500;line-height:1.4;color:var(--text)}
.s-acts{display:flex;gap:1px;opacity:0;transition:opacity .12s;flex-shrink:0}
.scard:hover .s-acts{opacity:1}
.s-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:.7rem;color:var(--text2)}
.wp-inp{margin-top:4px;width:100%;padding:4px 8px;background:#fff;border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.76rem;font-family:'Noto Sans JP',sans-serif}
.wp-inp:focus{outline:none;border-color:#06b6d4}

/* dog-ear + badge */
.dogear{position:absolute;top:0;right:0;width:0;height:0;border-top:18px solid #06b6d4;border-left:18px solid transparent;z-index:2}
.wbadge{position:absolute;top:1px;right:2px;font-size:.58rem;color:#fff;z-index:3;line-height:1}

/* ── COMPLETED SECTION ── */
.comp-sec{margin-top:28px}
.comp-hdr{display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:14px}
.comp-tog{color:var(--text2);font-size:.85rem;transition:transform .2s}
.comp-tog.open{transform:rotate(180deg)}

/* ── MODAL ── */
.mover{position:fixed;inset:0;background:rgba(10,30,80,.4);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .2s;pointer-events:none}
.mover.vis{opacity:1;pointer-events:all}
.modal{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:0 20px 60px rgba(26,86,219,.2);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:22px;transform:translateY(14px);transition:transform .2s}
.mover.vis .modal{transform:translateY(0)}
.modal h2{font-size:1.05rem;font-weight:700;margin-bottom:18px;color:var(--text);display:flex;align-items:center;gap:7px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* ── FORM ── */
.fg{margin-bottom:12px}
.flbl{display:block;font-size:.77rem;font-weight:600;color:var(--text);margin-bottom:5px}
.fi,.fsel2,.fta{width:100%;padding:9px 11px;background:#fff;border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.85rem;transition:border-color .15s}
.fi:focus,.fsel2:focus,.fta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,86,219,.12)}
.fta{resize:vertical;min-height:70px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcks{display:flex;gap:14px;flex-wrap:wrap}
.fck{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.fck input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

/* ── TAG INPUT ── */
.tiw{display:flex;flex-wrap:wrap;gap:5px;padding:7px;background:#fff;border:1px solid var(--border);border-radius:var(--rs);min-height:42px;align-items:center;cursor:text}
.tiw:focus-within{border-color:var(--accent)}
.tiw input{flex:1;min-width:90px;background:transparent;border:none;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:.85rem;outline:none}
/* ── TAG ADD BUTTON ── */
.tag-add-row{display:flex;gap:6px;align-items:stretch;margin-top:6px}
.tag-add-row .tiw{flex:1;margin-top:0}
.tag-add-btn{min-height:44px;padding:0 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-family:'Noto Sans JP',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s,box-shadow .15s;box-shadow:0 2px 8px rgba(26,86,219,.25)}
.tag-add-btn:hover{background:#1d4ed8;box-shadow:0 4px 14px rgba(26,86,219,.4)}
.tag-add-btn:active{transform:scale(.97)}
.tchip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:.75rem;font-weight:600}
.trm{width:13px;height:13px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.25);font-size:9px;cursor:pointer;line-height:1}
.trm:hover{background:rgba(255,255,255,.4)}
.cprow{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
.csw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.csw:hover{transform:scale(1.2)}.csw.sel{border-color:#fff;transform:scale(1.1)}

/* ── ROUTINE SECTION ── */
.rout-sec{background:#f0f5ff;border:1px solid var(--border);border-radius:var(--rs);padding:11px;margin-top:6px}

/* ── HISTORY ── */
.hist-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rs);background:#fff}
.hist-item{padding:9px 12px;border-bottom:1px solid var(--border);font-size:.82rem;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.hist-item:last-child{border-bottom:none}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:#1a56db;color:#fff;border:none;border-radius:var(--rs);padding:11px 15px;font-size:.84rem;box-shadow:0 8px 28px rgba(26,86,219,.4);z-index:2000;animation:siu .28s ease;max-width:300px}
@keyframes siu{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fdo{to{opacity:0;transform:translateY(-8px)}}
.empty-st{text-align:center;padding:44px 20px;color:var(--text2);grid-column:1/-1;font-size:.9rem}
.drag-ph{border:2px dashed var(--border2);border-radius:var(--r);background:rgba(79,142,247,.04);min-height:120px}

/* ── CARD URLS ── */
.card-urls{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.card-url{font-size:.75rem;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:4px;padding:3px 7px;background:rgba(26,86,219,.07);border-radius:4px;border:1px solid rgba(26,86,219,.18);word-break:break-all;overflow-wrap:break-word;transition:background .15s;cursor:pointer}
.card-url:hover{background:rgba(26,86,219,.14)}
.url-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.url-row .fi{flex:1}
/* ── SUB ROUTINE BADGE ── */
.srout-badge{display:inline-flex;align-items:center;gap:3px;font-size:.65rem;padding:1px 5px;border-radius:8px;background:rgba(26,86,219,.12);color:var(--accent);border:1px solid rgba(26,86,219,.25);flex-shrink:0}
/* ── DRAG VISUAL SYSTEM ── */
/* Insert line */
#gline{position:fixed;z-index:9998;pointer-events:none;border-radius:2px;height:3px;display:none;
  background:linear-gradient(90deg,transparent,#1a56db 8%,#1a56db 92%,transparent);
  box-shadow:0 0 10px rgba(26,86,219,.85),0 0 22px rgba(26,86,219,.4);
  transition:top .07s,left .07s,width .07s}
#gline::before,#gline::after{content:'';position:absolute;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px rgba(26,86,219,.8)}
#gline::before{left:-4px}#gline::after{right:-4px}
/* Floating clone */
.drag-clone-act{position:fixed!important;pointer-events:none!important;z-index:9999!important;opacity:.86;
  transform:rotate(2deg) scale(1.04);
  box-shadow:0 28px 68px rgba(0,0,0,.85),0 0 0 2px var(--accent)!important;
  border-radius:var(--r)!important;will-change:left,top}
/* Placeholder at source */
.drag-ph-card{border:2px dashed rgba(26,86,219,.3);background:rgba(26,86,219,.04);border-radius:var(--r);animation:ph-blink 1.6s ease infinite;pointer-events:none}
.drag-ph-sub{border:2px dashed rgba(26,86,219,.25);background:rgba(26,86,219,.03);border-radius:7px;animation:ph-blink 1.6s ease infinite;pointer-events:none;min-height:36px}
@keyframes ph-blink{0%,100%{border-color:rgba(26,86,219,.15);background:rgba(26,86,219,.02)}50%{border-color:rgba(26,86,219,.4);background:rgba(26,86,219,.06)}}
/* Gap spread animation */
.pcard.gap-t{margin-top:24px!important}
.pcard.gap-b{margin-bottom:24px!important}
.scard.gap-t-s{margin-top:16px!important}
.scard.gap-b-s{margin-bottom:16px!important}
/* ── DRAG HANDLE ── */
.drag-handle{
  display:none; /* PC では非表示 */
  align-items:center;justify-content:center;
  cursor:grab;color:rgba(255,255,255,.3);
  font-size:1.2rem;letter-spacing:-.1em;
  flex-shrink:0;touch-action:none;
  -webkit-user-select:none;user-select:none;
  transition:color .15s;
}
.drag-handle:active{color:rgba(26,86,219,.8);cursor:grabbing}
/* 長押しリフトアニメーション */
@keyframes lift-card{
  0%  {transform:scale(1)   translateY(0);  box-shadow:var(--sh)}
  60% {transform:scale(1.025)translateY(-5px);box-shadow:0 20px 52px rgba(0,0,0,.75),0 0 0 2px var(--accent)}
  100%{transform:scale(1.02) translateY(-3px);box-shadow:0 16px 44px rgba(0,0,0,.7),  0 0 0 2px var(--accent)}
}
@keyframes lift-sub{
  0%  {transform:scale(1)}
  100%{transform:scale(1.04);box-shadow:0 8px 28px rgba(0,0,0,.65),0 0 0 2px var(--accent)}
}
.pcard.lifting{animation:lift-card .35s ease forwards;z-index:10;position:relative}
.scard.lifting-s{animation:lift-sub .3s ease forwards;z-index:5;position:relative}

/* ── CLOUD SYNC STATUS ── */
.sync-bar{
  display:flex;align-items:center;gap:6px;padding:5px 20px;
  font-size:.72rem;font-family:'JetBrains Mono',monospace;
  background:var(--bg);border-bottom:1px solid var(--border);
  min-height:28px;
}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s}
.sync-dot.ok   {background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.6)}
.sync-dot.saving{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,.6);animation:dot-blink .7s ease infinite}
.sync-dot.err  {background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.6)}
.sync-dot.off  {background:#4b5563}
@keyframes dot-blink{0%,100%{opacity:1}50%{opacity:.35}}
.sync-msg{color:var(--text2);letter-spacing:.03em;flex:1}
.sync-id{color:var(--text2);font-size:.65rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.sync-retry{padding:2px 8px;font-size:.7rem;background:rgba(26,86,219,.1);border:1px solid rgba(26,86,219,.25);border-radius:4px;color:var(--accent);cursor:pointer;white-space:nowrap}
.sync-retry:hover{background:rgba(79,142,247,.22)}
.sync-reset{padding:2px 8px;font-size:.7rem;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:4px;color:#fca5a5;cursor:pointer;margin-left:4px;white-space:nowrap}
.sync-reset:hover{background:rgba(239,68,68,.16)}

@media(max-width:640px){

}
</style>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let S = {cards:[],done:[],tagColors:{},routHist:[],sortedByDue:false};

const TAG_COLORS=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f43f5e','#84cc16','#9ca3af'];
let curTagColor=TAG_COLORS[0],editTags=[],editUrls=[],editCardId=null,editSubId=null,editParId=null,insertIdx=null,routCardId=null;
let routSubPid=null,routSubSid=null; // ⑤サブルーチン用
let filteredCards=null;

function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
// ─────────────────────────────────────────────
// CLOUD SYNC — GitHub Gist（トークンはLocalStorageに保存）
// ─────────────────────────────────────────────
const DEFAULT_GIST_ID = "7ef6f106898526f60ab0037ac58d07d2";
const LS_GIST_ID      = 'tb3pb_gist_id';
function _getGistId(){return localStorage.getItem(LS_GIST_ID)||DEFAULT_GIST_ID;} // 仕事用と同じGist
const GIST_FILE = "taskboard_pb.json";                 // PB用は別ファイル
const GIST_BASE = "https://api.github.com/gists";
const LS_DIRTY  = 'tb3pb_dirty';
const LS_CACHE  = 'tb3pb_cache';
const LS_STASH  = 'tb3pb_stash';
const LS_BACKUP = 'tb3pb_backup';
const LS_TOKEN  = 'tb3_gist_token'; // 仕事用と共通（1回設定すればOK）

let _saveTimer=null, _saving=false, _isLoading=false;
let _lastSavedTime=null;
let _online=navigator.onLine;
let _localVersion=0, _lastSyncTime=0, _lastSyncError=0;
const _SYNC_THROTTLE=300000;
const _ERROR_COOLDOWN=60000;

function _getToken(){return localStorage.getItem(LS_TOKEN)||'';}
function _gistHeaders(){
  return{'Authorization':'Bearer '+_getToken(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
}

console.log('[TaskBoard PB] Gist ID:', _getGistId(), '| File:', GIST_FILE);
console.log('[TaskBoard PB] Token設定済み:', !!_getToken());

function _needsSetup(){return !_getToken();}
function openTokenSetup(){
  openSettings();
}
async function saveTokenSetup_legacy(){
  const t=document.getElementById('tokenInput').value.trim();
  if(!t){toast('⚠️ トークンを入力してください');return;}
  const btn=document.getElementById('tokenSaveBtn');
  btn.textContent='確認中…';btn.disabled=true;
  try{
    const res=await fetch(GIST_BASE+'/'+_getGistId(),{
      headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github.v3+json'}
    });
    if(res.status===401){toast('❌ トークンが無効です');btn.textContent='保存して接続';btn.disabled=false;return;}
    if(res.status===404){toast('❌ Gist IDが見つかりません');btn.textContent='保存して接続';btn.disabled=false;return;}
    if(!res.ok){toast('❌ 接続エラー HTTP '+res.status);btn.textContent='保存して接続';btn.disabled=false;return;}
    localStorage.setItem(LS_TOKEN,t);
    closeModal('settingsModal');
    toast('✅ 接続成功！データを読み込みます');
    cloudLoad(true);
  }catch(e){
    toast('❌ 通信エラー: '+e.message);
    btn.textContent='保存して接続';btn.disabled=false;
  }
}

window.tbDiag=async function(){
  console.group('[tbDiag PB] GitHub Gist 接続テスト');
  console.log('Gist ID:', _getGistId(), '| File:', GIST_FILE);
  console.log('Token設定済み:', !!_getToken());
  try{
    const res=await fetch(GIST_BASE+'/'+_getGistId(),{headers:_gistHeaders()});
    console.log('HTTP Status:', res.status, res.statusText);
    if(res.ok){const g=await res.json();const d=JSON.parse(g.files[GIST_FILE]?.content||'{}');console.log('✅ 接続成功 カード:'+(d.cards||[]).length+'件');}
    else{console.error('❌ HTTP '+res.status);}
  }catch(e){console.error('❌ 通信エラー:',e.message);}
  console.groupEnd();
};

function setSyncUI(state,msg,showRetry=false){
  const dot=document.getElementById('syncDot');
  const msgEl=document.getElementById('syncMsg');
  const idEl=document.getElementById('syncId');
  const retry=document.getElementById('syncRetryBtn');
  if(dot)dot.className='sync-dot '+state;
  if(msgEl)msgEl.textContent=msg;
  if(idEl)idEl.textContent='Gist:'+_getGistId().slice(-8);
  if(retry)retry.style.display=showRetry?'':'none';
  _updateSavedAt();
}

function _updateSavedAt(){
  const el=document.getElementById('syncSavedAt');
  if(!el)return;
  if(_lastSavedTime){
    const h=_lastSavedTime.getHours().toString().padStart(2,'0');
    const m=_lastSavedTime.getMinutes().toString().padStart(2,'0');
    el.textContent='最終保存 '+h+':'+m;
  }else{
    el.textContent='';
  }
}

function lsSave(){try{localStorage.setItem(LS_CACHE,JSON.stringify(S));}catch(e){}}
function lsLoad(){
  try{const r=localStorage.getItem(LS_CACHE);
    if(r){const d=JSON.parse(r);S={...S,...d};S.cards=(S.cards||[]).map(nc);S.done=(S.done||[]).map(nc)}}
  catch(e){}
}
function lsBackup(){try{localStorage.setItem(LS_BACKUP,JSON.stringify({data:S,savedAt:Date.now()}))}catch(e){}}

function applyData(d){
  S={...S,...d};
  S.cards=(S.cards||[]).map(nc);
  S.done=(S.done||[]).map(nc);
  S.tagColors=d.tagColors||{};
  S.routHist=d.routHist||[];
  S.sortedByDue=!!d.sortedByDue;
  _localVersion=Number(d.version)||0;
}

function save(){
  if(_isLoading)return;
  lsSave();
  localStorage.setItem(LS_DIRTY,'1');
  if(!_online){setSyncUI('off','オフライン（ローカル保存済み）');return}
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>cloudSave(),3000);
}

async function cloudSave(){
  if(_saving)return;
  if(_needsSetup()){openTokenSetup();return;}
  _saving=true;
  setSyncUI('saving','保存中…');
  try{
    S.version=(_localVersion||0)+1;
    const res=await fetch(GIST_BASE+'/'+_getGistId(),{
      method:'PATCH',
      headers:_gistHeaders(),
      body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(S)}}})
    });
    if(res.status===401){localStorage.removeItem(LS_TOKEN);openTokenSetup();throw new Error('トークン期限切れ');}
    if(!res.ok)throw new Error('HTTP '+res.status);
    _localVersion=S.version;
    lsSave();localStorage.removeItem(LS_DIRTY);
    console.log('[Gist PB] 保存成功 v'+_localVersion+' カード:'+S.cards.length+'件');
    _lastSavedTime=new Date();
    _updateSavedAt();
    setSyncUI('ok','クラウド保存済み ✓ (v'+_localVersion+')');
  }catch(e){
    lsBackup();
    setSyncUI('err','通信エラー（ローカル保存済み）',true);
    if(!e.message.includes('トークン'))toast('📡 通信エラーです。LocalStorageに一時保存しました');
  }finally{_saving=false}
}

async function cloudLoad(isManual=false){
  if(_needsSetup()){
    lsLoad();pruneHistory();render();
    _isLoading=false;
    setSyncUI('off','トークン未設定（ローカルデータを表示中）');
    openTokenSetup();return;
  }
  _isLoading=true;
  if(!_online){lsLoad();_isLoading=false;setSyncUI('off','オフライン（キャッシュ使用中）');render();return}
  setSyncUI('saving','読込中…');
  console.group('[Gist PB] cloudLoad');
  try{
    const res=await fetch(GIST_BASE+'/'+_getGistId(),{headers:_gistHeaders()});
    console.log('HTTP:',res.status);
    if(res.status===401){localStorage.removeItem(LS_TOKEN);openTokenSetup();throw new Error('トークン期限切れ');}
    if(!res.ok)throw new Error('HTTP '+res.status);
    const g=await res.json();
    const content=g.files[GIST_FILE]?.content;
    if(!content){
      // 初回アクセス: taskboard_pb.json未作成 → LocalStorageのデータで初期化
      console.log('[Gist PB] 初回: taskboard_pb.jsonを作成します');
      lsLoad();
      if((S.cards&&S.cards.length>0)||(S.done&&S.done.length>0)){
        const init={...S,version:1};
        const ir=await fetch(GIST_BASE+'/'+_getGistId(),{
          method:'PATCH',headers:_gistHeaders(),
          body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(init)}}})
        });
        if(ir.ok){_localVersion=1;lsSave();console.log('[Gist PB] 初回保存成功');}
      }
      pruneHistory();_lastSyncTime=Date.now();render();_isLoading=false;
      setSyncUI('ok','初回セットアップ完了 ✓');console.groupEnd();return;
    }
    const data=JSON.parse(content);
    const remoteVer=Number(data.version)||0;
    console.log('読込成功 v'+remoteVer+' カード:'+(data.cards||[]).length+'件');
    if(!isManual&&remoteVer>0&&remoteVer===_localVersion){
      _lastSyncTime=Date.now();_isLoading=false;
      setSyncUI('ok','同期済み ✓ (v'+_localVersion+')');
      console.groupEnd();return;
    }
    applyData(data);lsSave();localStorage.removeItem(LS_DIRTY);
    pruneHistory();_lastSyncTime=Date.now();
    render();_isLoading=false;
    setSyncUI('ok','読込完了 ✓'+(isManual?' （手動）':''));
    console.groupEnd();
  }catch(e){
    lsLoad();lsBackup();pruneHistory();
    _lastSyncTime=Date.now();_lastSyncError=Date.now();
    render();_isLoading=false;
    console.error('[Gist PB] 読込失敗:',e.message);
    console.groupEnd();
    if(!e.message.includes('トークン')){
      setSyncUI('err','通信エラー（キャッシュ使用中）',true);
      if(isManual)toast('📡 通信エラーです。LocalStorageのデータを表示中です');
    }
  }
}

// ─────────────────────────────────────────────
// DATE UTILS
// ─────────────────────────────────────────────
function toStr(d){return d.toLocaleDateString('sv')} // YYYY-MM-DD
function today(){return toStr(new Date())}
function tmr(){const d=new Date();d.setDate(d.getDate()+1);return toStr(d)}
function fmtD(s){if(!s)return'';const d=new Date(s+'T00:00:00');return`${d.getMonth()+1}/${d.getDate()}`}
function dueCls(s){if(!s)return'';const t=today(),tm=tmr();if(s===t)return'due-today';if(s===tm)return'due-tmr';if(s<t)return'due-past';return''}
function dueLabel(cls){if(cls==='due-today')return' <span style="color:#fca5a5;font-size:.68rem">今日</span>';if(cls==='due-tmr')return' <span style="color:#fcd34d;font-size:.68rem">明日</span>';if(cls==='due-past')return' <span style="color:#f87171;font-size:.68rem">期限切れ</span>';return''}
function calcNext(type,day,from){
  const d=from?new Date(from+'T00:00:00'):new Date();
  if(type==='daily'){d.setDate(d.getDate()+1)}
  else if(type==='weekly'){const cur=d.getDay();let diff=day-cur;if(diff<=0)diff+=7;d.setDate(d.getDate()+diff)}
  else{d.setMonth(d.getMonth()+1);d.setDate(day)}
  return toStr(d)
}

function getTColor(tag){if(!S.tagColors[tag])S.tagColors[tag]=TAG_COLORS[Object.keys(S.tagColors).length%TAG_COLORS.length];return S.tagColors[tag]}
function hex2rgba(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}

function prog(card){if(!card.subCards.length)return null;const d=card.subCards.filter(s=>s.completed).length;return{d,t:card.subCards.length}}
function bandCls(c){if(c.urgent&&c.important)return'b-ri';if(c.urgent)return'b-r';if(c.important)return'b-i';return'b-n'}
function cardBg(c){if(c.tags&&c.tags.length){const col=getTColor(c.tags[0]);return hex2rgba(col,.28)}return'var(--surface)'}

function toggleDrBar(){
  const bar=document.getElementById('drBar');
  const isVisible=bar.style.display!=='none';
  if(isVisible){clearDrFilter();bar.style.display='none';}
  else{bar.style.display='flex';document.getElementById('drFrom').focus();}
  document.getElementById('sortBtn').classList.toggle('sort-on',!isVisible&&_drActive);
}

function applyDrFilter(){
  _drFrom=document.getElementById('drFrom').value;
  _drTo=document.getElementById('drTo').value;
  _drActive=!!(_drFrom||_drTo);
  document.getElementById('sortBtn').classList.toggle('sort-on',_drActive);
  const cnt=_countDrCards();
  document.getElementById('drLabel').textContent=_drActive?`${cnt}件該当`:'';
  renderBoard();
}

function _countDrCards(){
  return S.cards.filter(c=>_cardMatchesDr(c)).length;
}

function _cardMatchesDr(c){
  // 大カードの期日チェック
  if(c.dueDate&&_inDrRange(c.dueDate))return true;
  // 小カードの期日チェック
  if(c.subCards.some(s=>s.dueDate&&_inDrRange(s.dueDate)))return true;
  return false;
}

function _inDrRange(dateStr){
  if(!dateStr)return false;
  if(_drFrom&&dateStr<_drFrom)return false;
  if(_drTo&&dateStr>_drTo)return false;
  return true;
}

function clearDrFilter(){
  _drFrom='';_drTo='';_drActive=false;_drView='A';
  document.getElementById('drFrom').value='';
  document.getElementById('drTo').value='';
  document.getElementById('drLabel').textContent='';
  document.getElementById('sortBtn').classList.remove('sort-on');
  setDrView('A');
  renderBoard();
}

function setDrView(v){
  _drView=v;
  document.getElementById('drViewA').classList.toggle('active',v==='A');
  document.getElementById('drViewB').classList.toggle('active',v==='B');
  renderBoard();
}

// ③ 今日期日を明日へ一括変更
// ─────────────────────────────────────────────
function moveTodayToTomorrow(){
  const t=today(),tm=tmr();
  let cnt=0;
  S.cards.forEach(c=>{
    if(!c.completed){
      // 大カード
      if(c.dueDate===t){c.dueDate=tm;cnt++;}
      // 小カード
      c.subCards.forEach(s=>{
        if(!s.completed&&s.dueDate===t){s.dueDate=tm;cnt++;}
      });
    }
  });
  if(cnt===0){toast('📅 今日期日の未完了タスクはありません');return;}
  toast(`📅 ${cnt}件のタスクの期日を明日（${fmtD(tm)}）に変更しました`);
  render();
}

function renderBoard(){
  const board=document.getElementById('board');
  let cards=filteredCards!==null?filteredCards:S.cards;
  // ④ apply badge date filter
  if(dueBadgeFilter){
    const t=today();
    if(dueBadgeFilter==='past'){
      cards=cards.filter(c=>!c.completed&&(
        (c.dueDate&&c.dueDate<t)||
        c.subCards.some(s=>!s.completed&&s.dueDate&&s.dueDate<t)
      ));
    } else {
      const dateStr=dueBadgeFilter==='today'?t:tmr();
      cards=cards.filter(c=>!c.completed&&(c.dueDate===dateStr||c.subCards.some(s=>!s.completed&&s.dueDate===dateStr)));
    }
  }
  // 期間フィルター
  if(_drActive){
    cards=cards.filter(c=>_cardMatchesDr(c));
  }
  if(!cards.length){board.innerHTML='<div class="empty-st">📭<br><br>該当するカードがありません</div>';return}
  const ordered=_drActive
    ?[...cards].sort((a,b)=>{
        // 期間フィルター中は期日順ソート（大カード優先、小カード期日も考慮）
        const aDate=a.dueDate||(a.subCards.filter(s=>_inDrRange(s.dueDate)).map(s=>s.dueDate).sort()[0])||'9999';
        const bDate=b.dueDate||(b.subCards.filter(s=>_inDrRange(s.dueDate)).map(s=>s.dueDate).sort()[0])||'9999';
        return aDate.localeCompare(bDate);
      })
    :[...cards].sort((a,b)=>a.order-b.order);
  // A案/B案の表示切替
  if(_drActive&&_drView==='B'){
    board.classList.add('list-mode');
  } else {
    board.classList.remove('list-mode');
  }
  board.innerHTML=ordered.map(c=>renderCard(c)).join('');
  initDrag();
}

function renderBadges(){

  const tmc=S.cards.filter(c=>c.dueDate===tm||c.subCards.some(s=>!s.completed&&s.dueDate===tm));
  // ①過去期日：大カード・小カード両方カウント（完了済み除外）
  const pastc=S.cards.filter(c=>
    (c.dueDate&&c.dueDate<t)||
    c.subCards.some(s=>!s.completed&&s.dueDate&&s.dueDate<t)
  );
  let h='';
  if(pastc.length)h+=`<span class="dbadge past${dueBadgeFilter==='past'?' active':''}" onclick="filterByDue('past')" title="期限切れで絞り込み">⚠️ 期限切れ ${pastc.length}件</span>`;

}

function applyFilters(){
  const kw=document.getElementById('searchInput').value.toLowerCase().trim();
  const cat=document.getElementById('fCat').value;
  const tag=document.getElementById('fTag').value;
  const pri=document.getElementById('fPri').value;
  if(!kw&&!cat&&!tag&&!pri){filteredCards=null;renderBoard();return}
  filteredCards=S.cards.filter(c=>{
    if(kw){
      // ② 大カードタイトル・メモ・タグ + 小カードのタスク名・担当者名 を検索対象に
      const subMatch=c.subCards.some(s=>
        s.title.toLowerCase().includes(kw)||
        (s.waitingPerson||'').toLowerCase().includes(kw)
      );
      if(!c.title.toLowerCase().includes(kw)&&!c.memo.toLowerCase().includes(kw)&&!c.tags.some(t=>t.toLowerCase().includes(kw))&&!subMatch)return false;
    }
    if(cat&&c.category!==cat)return false;
    if(tag&&!c.tags.includes(tag))return false;
    if(pri){
      if(pri==='ri'&&!(c.urgent&&c.important))return false;
      if(pri==='r'&&!(c.urgent&&!c.important))return false;
      if(pri==='i'&&!(!c.urgent&&c.important))return false;
      if(pri==='n'&&(c.urgent||c.important))return false;
    }
    return true;
  });
  renderBoard();
}

/* ── 大カード完了チェックボックス ── */
/* ════════════════════════════════════════════
   大カード 完了チェック処理
   onclick から直接呼ばれる（onchange は使わない）
   ════════════════════════════════════════════ */
function handleCardCheck(id, chkEl){
  const nowChecked = chkEl.checked;

  if(nowChecked){
    // ── チェック ON：確認ポップアップ ──
    const ok = confirm('このタスクを完了済みに移動しますか？');
    if(!ok){
      chkEl.checked = false;   // キャンセル → チェックを戻す
      return;
    }
    const c = S.cards.find(x => x.id === id);
    if(!c){ chkEl.checked = false; return; }

    if(c.isRoutine){
      // ルーチンは「次回へ」ダイアログ経由
      chkEl.checked = false;
      routCardId = id;
      document.getElementById('rcTitle').textContent = c.title;
      document.getElementById('nextDue').value = calcNext(c.routineType, c.routineDay, c.dueDate||today());
      openModal('routModal');
      return;
    }
    // 完了済みへ移動
    c.completed = true;
    S.cards = S.cards.filter(x => x.id !== id);
    S.done.unshift(c);
    toast('✅ 完了済みに移動しました');
    const cb = document.getElementById('compBoard');
    if(cb && cb.style.display === 'none') toggleCompleted();

  } else {
    // ── チェック OFF：進行中へ戻す ──
    // 完了済みエリアのカードを探す
    const di = S.done.findIndex(x => x.id === id);
    if(di >= 0){
      const dc = S.done.splice(di, 1)[0];
      dc.completed = false;
      dc.order = S.cards.length;
      S.cards.push(dc);
    } else {
      // フォールバック：S.cards 側で completed フラグだけ落とす
      const c = S.cards.find(x => x.id === id);
      if(c) c.completed = false;
    }
    toast('↩ 進行中に戻しました');
  }
  render();
}

function saveSubCard(){
  const title=document.getElementById('smName').value.trim();
  if(!title){alert('タスク名を入力してください');return}
  const c=S.cards.find(x=>x.id===editParId);if(!c)return;
  const smIsR=document.getElementById('smRoutine').checked;
  const smRType=document.getElementById('smRType')?.value||'daily';
  let smRDay=1;const srd=document.getElementById('smRDay');if(srd)smRDay=parseInt(srd.value)||1;
  const data={title,dueDate:document.getElementById('smDue').value,workAmount:document.getElementById('smWork').value,waitingPerson:document.getElementById('smWP').value.trim(),isRoutine:smIsR,routineType:smRType,routineDay:smRDay};
  if(editSubId){const s=c.subCards.find(x=>x.id===editSubId);if(s)Object.assign(s,data)}
  else{
    const newS=ns({...data,id:gid(),completed:false});
    const sorted=[...c.subCards].sort((a,b)=>a.order-b.order);
    sorted.splice(insertIdx??sorted.length,0,newS);
    sorted.forEach((s,i)=>s.order=i);c.subCards=sorted;
  }
  closeModal('subModal');render();
}

// ═══════════════════════════════════════════════
// UNIFIED DRAG & DROP (Pointer Events + Touch)
// ═══════════════════════════════════════════════

/* ── Drag state ── */
const DG={on:false,pending:false,type:null,id:null,pid:null,el:null,clone:null,ph:null,
          iEl:null,iBefore:true,ox:0,oy:0,sx:0,sy:0,timer:null};
let gLine=null,_dgInited=false;

/* ── Init (called after each render) ── */
function initDrag(){
  if(!_dgInited){
    // Create insert-line element
    gLine=document.createElement('div');gLine.id='gline';document.body.appendChild(gLine);
    // Global listeners
    document.addEventListener('pointermove',_dgMove,{passive:false});
    document.addEventListener('pointerup',_dgUp);
    document.addEventListener('pointercancel',_dgCancel);
    // Prevent context menu during drag (long press on iOS)
    document.addEventListener('contextmenu',e=>{if(DG.el||DG.pending)e.preventDefault()});
    _dgInited=true;
  }
  // Per-card listeners (fresh elements each render)
  document.querySelectorAll('.pcard').forEach(el=>el.addEventListener('pointerdown',_cardDown));
  document.querySelectorAll('.scard').forEach(el=>el.addEventListener('pointerdown',_subDown));
}

/* ── Pointerdown — parent card ── */
function _cardDown(e){
  if(e.button&&e.button!==0)return;
  if(e.target.closest('button,.ins-btn,.s-chk,.wp-inp,.pchk,label,.card-url,a'))return;
  if(DG.on||DG.pending)return;
  const isTouch=e.pointerType==='touch';
  const onHandle=e.target.closest('.drag-handle[data-handle="p"]');
  DG.el=e.currentTarget;DG.type='p';DG.id=e.currentTarget.dataset.id;DG.pid=null;
  DG.sx=e.clientX;DG.sy=e.clientY;
  if(!isTouch||onHandle){
    e.currentTarget.setPointerCapture(e.pointerId);
    _dgActivate(e.clientX,e.clientY);
  } else {
    DG.timer=setTimeout(()=>{
      if(!DG.el||DG.on)return;
      DG.pending=true;
      navigator.vibrate&&navigator.vibrate(50);
      DG.el.classList.add('lifting');
    },800);
  }
}

/* ── Pointerdown — sub card ── */
function _subDown(e){
  if(e.button&&e.button!==0)return;
  if(e.target.closest('button,.ins-btn,.s-chk,.wp-inp,.pchk,label,.card-url,a'))return;
  if(DG.on||DG.pending)return;
  e.stopPropagation();
  const isTouch=e.pointerType==='touch';
  const onHandle=e.target.closest('.drag-handle[data-handle="s"]');
  DG.el=e.currentTarget;DG.type='s';
  DG.id=e.currentTarget.dataset.subid;DG.pid=e.currentTarget.dataset.pid;
  DG.sx=e.clientX;DG.sy=e.clientY;
  if(!isTouch||onHandle){
    e.currentTarget.setPointerCapture(e.pointerId);
    _dgActivate(e.clientX,e.clientY);
  } else {
    DG.timer=setTimeout(()=>{
      if(!DG.el||DG.on)return;
      DG.pending=true;
      navigator.vibrate&&navigator.vibrate(50);
      DG.el.classList.add('lifting-s');
    },800);
  }
}

/* ── Activate drag visuals ── */
function _dgActivate(x,y){
  DG.on=true;DG.pending=false;
  if(DG.timer){clearTimeout(DG.timer);DG.timer=null;}
  DG.el.classList.remove('lifting','lifting-s');
  // Placeholder (maintains layout space)
  const ph=document.createElement('div');
  ph.className=DG.type==='p'?'drag-ph-card':'drag-ph-sub';
  ph.style.height=DG.el.offsetHeight+'px';
  DG.el.before(ph);DG.el.style.visibility='hidden';DG.ph=ph;
  // Floating clone
  const clone=DG.el.cloneNode(true);
  clone.removeAttribute('id');clone.classList.add('drag-clone-act');
  clone.style.width=DG.el.offsetWidth+'px';
  document.body.appendChild(clone);DG.clone=clone;
  const r=DG.el.getBoundingClientRect();
  DG.ox=x-r.left;DG.oy=y-r.top;
  _mvClone(x,y);
}
function _mvClone(x,y){if(DG.clone){DG.clone.style.left=(x-DG.ox)+'px';DG.clone.style.top=(y-DG.oy)+'px'}}

/* ── Pointermove (document) ── */
function _dgMove(e){
  if(!DG.el&&!DG.pending&&!DG.on)return;
  const dx=Math.abs(e.clientX-DG.sx),dy=Math.abs(e.clientY-DG.sy);
  // Pending long press → activate on first move
  if(DG.pending&&!DG.on){
    try{DG.el.setPointerCapture(e.pointerId)}catch(_){}
    _dgActivate(e.clientX,e.clientY);return;
  }
  // Cancel long press if finger scrolls
  if(DG.timer&&(dx>10||dy>10)){
    clearTimeout(DG.timer);DG.timer=null;
    if(DG.el)DG.el.classList.remove('lifting','lifting-s');
    DG.el=null;return;
  }
  if(!DG.on)return;
  e.preventDefault();
  _mvClone(e.clientX,e.clientY);
  if(DG.type==='p')_updPI(e.clientX,e.clientY);
  else _updSI(e.clientX,e.clientY);
}

/* ── Pointerup ── */
function _dgUp(e){
  if(DG.timer){clearTimeout(DG.timer);DG.timer=null;}
  if(DG.el)DG.el.classList.remove('lifting','lifting-s');
  if(DG.pending){DG.pending=false;_dgClean();return;}
  if(!DG.on){DG.el=null;return;}
  if(DG.type==='p')_dropP();else _dropS();
  _dgClean();
}
function _dgCancel(){
  if(DG.timer){clearTimeout(DG.timer);DG.timer=null;}
  if(DG.el)DG.el.classList.remove('lifting','lifting-s');
  _dgClean();
}

/* ── Insert point detection — parent cards ── */
function _updPI(x,y){
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('gap-t','gap-b','drag-ov'));
  if(gLine)gLine.style.display='none';
  DG.iEl=null;
  const cards=[...document.querySelectorAll('.pcard')].filter(c=>c.style.visibility!=='hidden');
  for(const c of cards){
    const r=c.getBoundingClientRect();
    if(y>=r.top-14&&y<=r.bottom+14&&x>=r.left-10&&x<=r.right+10){
      DG.iEl=c;DG.iBefore=y<=(r.top+r.height*.5);
      c.classList.add(DG.iBefore?'gap-t':'gap-b');
      c.classList.add('drag-ov');
      _showLine(r.left,DG.iBefore?r.top-2:r.bottom+2,r.width);
      break;
    }
  }
}

/* ── Insert point detection — sub cards ── */
function _updSI(x,y){
  const pid=DG.pid;
  document.querySelectorAll(`.scard[data-pid="${pid}"]`).forEach(s=>s.classList.remove('gap-t-s','gap-b-s','drag-ov-s'));
  if(gLine)gLine.style.display='none';
  DG.iEl=null;
  const subs=[...document.querySelectorAll(`.scard[data-pid="${pid}"]`)].filter(s=>s.style.visibility!=='hidden');
  for(const s of subs){
    const r=s.getBoundingClientRect();
    if(y>=r.top-7&&y<=r.bottom+7){
      DG.iEl=s;DG.iBefore=y<=(r.top+r.height*.5);
      s.classList.add(DG.iBefore?'gap-t-s':'gap-b-s');
      s.classList.add('drag-ov-s');
      _showLine(r.left,DG.iBefore?r.top-2:r.bottom+2,r.width);
      break;
    }
  }
}

/* ── Insert line show/hide ── */
function _showLine(x,y,w){
  if(!gLine)return;
  gLine.style.left=x+'px';gLine.style.top=y+'px';gLine.style.width=w+'px';gLine.style.display='block';
}

/* ── Drop — parent cards ── */
function _dropP(){
  if(!DG.iEl)return;
  const tid=DG.iEl.dataset.id,sid=DG.id;
  if(tid===sid)return;
  const si=S.cards.findIndex(c=>c.id===sid),ti=S.cards.findIndex(c=>c.id===tid);
  if(si<0||ti<0)return;
  const[sc]=S.cards.splice(si,1);
  const nti=S.cards.findIndex(c=>c.id===tid);
  // top-half(iBefore=true)→insert before target; bottom-half→insert after
  S.cards.splice(DG.iBefore?nti:nti+1,0,sc);
  S.cards.forEach((c,i)=>c.order=i);
  render();
}

/* ── Drop — sub cards (column-reverse container) ── */
function _dropS(){
  if(!DG.iEl)return;
  const tsid=DG.iEl.dataset.subid,ssid=DG.id,pid=DG.pid;
  if(tsid===ssid)return;
  const card=S.cards.find(c=>c.id===pid);if(!card)return;
  const subs=[...card.subCards].sort((a,b)=>a.order-b.order);
  const si=subs.findIndex(s=>s.id===ssid),ti=subs.findIndex(s=>s.id===tsid);
  if(si<0||ti<0)return;
  const[sc]=subs.splice(si,1);
  const nti=subs.findIndex(s=>s.id===tsid);
  // column-reverse: top-half visually = higher order = insert AFTER in ascending array
  subs.splice(DG.iBefore?nti+1:nti,0,sc);
  subs.forEach((s,i)=>s.order=i);card.subCards=subs;
  render();
}

/* ── Cleanup ── */
function _dgClean(){
  if(DG.clone){DG.clone.remove();DG.clone=null;}
  if(DG.ph){DG.ph.remove();DG.ph=null;}
  if(DG.el){DG.el.style.visibility='';DG.el=null;}
  if(gLine)gLine.style.display='none';
  document.querySelectorAll('.gap-t,.gap-b,.gap-t-s,.gap-b-s,.drag-ov,.drag-ov-s')
    .forEach(x=>x.classList.remove('gap-t','gap-b','gap-t-s','gap-b-s','drag-ov','drag-ov-s'));
  Object.assign(DG,{on:false,pending:false,type:null,id:null,pid:null,el:null,clone:null,ph:null,iEl:null,timer:null});
}

/* ── 設定モーダル ── */
function openSettings(){
  const gid=localStorage.getItem(LS_GIST_ID)||'';
  const tok=_getToken();
  const el=document.getElementById('settingGistId');
  const ti=document.getElementById('settingToken');
  if(el) el.value=gid;
  if(ti) ti.value='';
  const st=document.getElementById('settingStatus');
  if(st){
    const connected=!!tok;
    st.innerHTML=connected
      ?`<span style="color:var(--ok)">✅ 接続設定済み</span>　Gist: <code style="font-size:.8rem">${_getGistId().slice(0,8)}...${_getGistId().slice(-6)}</code>`
      :`<span style="color:var(--danger)">❌ 未設定</span>　Gist IDとトークンを入力してください`;
  }
  openModal('settingsModal');
}

async function testAndSaveSettings(){
  const newGid=document.getElementById('settingGistId').value.trim();
  const newTok=document.getElementById('settingToken').value.trim();
  const gid=newGid||_getGistId();
  const tok=newTok||_getToken();
  if(!tok){toast('⚠️ トークンを入力してください');return;}
  const btn=document.getElementById('settingSaveBtn');
  btn.textContent='確認中…';btn.disabled=true;
  const st=document.getElementById('settingStatus');
  if(st) st.innerHTML='🔄 接続テスト中...';
  try{
    const res=await fetch(GIST_BASE+'/'+gid,{
      headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github.v3+json'}
    });
    if(res.status===401){
      if(st) st.innerHTML='<span style="color:var(--danger)">❌ トークンが無効です</span>';
      btn.textContent='保存して接続テスト';btn.disabled=false;return;
    }
    if(res.status===404){
      if(st) st.innerHTML='<span style="color:var(--danger)">❌ Gist IDが見つかりません</span>';
      btn.textContent='保存して接続テスト';btn.disabled=false;return;
    }
    if(!res.ok){
      if(st) st.innerHTML=`<span style="color:var(--danger)">❌ エラー HTTP ${res.status}</span>`;
      btn.textContent='保存して接続テスト';btn.disabled=false;return;
    }
    if(newTok) localStorage.setItem(LS_TOKEN, newTok);
    if(newGid) localStorage.setItem(LS_GIST_ID, newGid);
    else if(!newGid && localStorage.getItem(LS_GIST_ID)===null && newGid==='')
      localStorage.removeItem(LS_GIST_ID);
    closeModal('settingsModal');
    toast('✅ 設定を保存しました。データを読み込みます');
    btn.textContent='保存して接続テスト';btn.disabled=false;
    cloudLoad(true);
  }catch(e){
    if(st) st.innerHTML=`<span style="color:var(--danger)">❌ 通信エラー: ${e.message}</span>`;
    btn.textContent='保存して接続テスト';btn.disabled=false;
  }
}

function clearSettings(){
  if(!confirm('接続設定をリセットしますか？\n（トークンとGist IDが削除されます）'))return;
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_GIST_ID);
  toast('🗑 設定をリセットしました');
  openSettings();
}

/* ── JSONエクスポート ── */
function exportJSON(){
  const data={...S, exportedAt:new Date().toISOString(), version:_localVersion};
  const json=JSON.stringify(data, null, 2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json;charset=utf-8'}));
  a.download=`taskboard_backup_${today()}.json`;
  a.click();
  toast('📋 JSONをエクスポートしました（'+S.cards.length+'件）');
}

function exportCSV(){
  const waLabel={light:'軽度','1h':'1時間程度',over1h:'1時間以上',waiting:'他者待ち'};
  const rtLabel={daily:'毎日',weekly:'毎週',monthly:'毎月'};
  const headers=[
    '種別','ID','タイトル','状態','期日','カテゴリ','緊急','重要',
    'タグ','メモ','参考URL',
    'ルーチン','ルーチン種別','ルーチン日',
    'サブタスク数','完了サブタスク数',
    '作業量','担当者','大カード作成日'
  ];
  const rows=[headers];
  const allCards=[...S.cards.map(c=>({...c,_done:false})),...S.done.map(c=>({...c,_done:true}))];
  allCards.forEach(c=>{
    const subTotal=( c.subCards||[]).length;
    const subDone =(c.subCards||[]).filter(s=>s.completed).length;
    rows.push([
      '大カード',
      c.id||'',
      c.title||'',
      c._done?'完了':'進行中',
      c.dueDate||'',
      c.category||'',
      c.urgent?'○':'-',
      c.important?'○':'-',
      (c.tags||[]).join(';'),
      c.memo||'',
      (c.urls||[]).join(';'),
      c.isRoutine?'○':'-',
      rtLabel[c.routineType]||c.routineType||'',
      c.routineDay!=null?c.routineDay:'',
      subTotal,
      subDone,
      '','',
      c.createdAt?new Date(c.createdAt).toLocaleDateString('ja-JP'):''
    ]);
    (c.subCards||[]).forEach(s=>rows.push([
      '小カード',
      s.id||'',
      '  └'+(s.title||''),
      s.completed?'完了':'未完了',
      s.dueDate||'',
      '','','','','','',
      s.isRoutine?'○':'-',
      rtLabel[s.routineType]||s.routineType||'',
      s.routineDay!=null?s.routineDay:'',
      '','',
      waLabel[s.workAmount]||s.workAmount||'',
      s.waitingPerson||'',
      ''
    ]));
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`taskboard_${today()}.csv`;
  a.click();
  toast('📊 CSVをエクスポートしました('+(rows.length-1)+'件)');
}

function openModal(id){
  const o=document.getElementById(id);o.style.display='flex';requestAnimationFrame(()=>o.classList.add('vis'));
  o.onclick=e=>{if(e.target===o)closeModal(id)};
}
function closeModal(id){const o=document.getElementById(id);o.classList.remove('vis');setTimeout(()=>o.style.display='none',200)}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.animation='fdo .28s ease forwards';setTimeout(()=>t.remove(),280)},2500);
}
